<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <style>
      html, body, #root { margin: 0; background: #f4f6fb; min-height: 100%; }
      #root:empty {
        min-height: 100vh;
        background:
          linear-gradient(#1e88e5, #1e88e5) left top / 40% 3px no-repeat,
          #f4f6fb;
        animation: pm-root-boot 1.1s ease-in-out infinite;
      }
      @keyframes pm-root-boot {
        0% { background-position: -40% 0, 0 0; }
        100% { background-position: 140% 0, 0 0; }
      }
      .pm-boot-bar {
        height: 3px;
        width: 35%;
        background: #1e88e5;
        animation: pm-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes pm-boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
